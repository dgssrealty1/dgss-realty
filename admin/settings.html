<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Branding — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="Branding" data-nav="settings">
</head>
<body data-settings-fields="company_name,logo_url">
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card admin-form-card">
    <p class="admin-card-intro">Your business name and logo appear in the header and footer of every page, in search results (structured data) and on shared links.</p>
    <form id="settingsForm" novalidate>
      <div class="admin-field">
        <label for="s-company_name">Company Name <span class="req">*</span></label>
        <input type="text" id="s-company_name" aria-describedby="s-company_name-hint" maxlength="120" data-required autocomplete="organization">
        <p class="admin-field-hint" id="s-company_name-hint">Used in page titles (“… | DGSS Realty”), the logo’s text alternative, structured data and WhatsApp messages.</p>
      </div>
      <div class="admin-field">
        <label for="s-logo_url">Logo</label>
        <input type="text" id="s-logo_url" aria-describedby="s-logo_url-hint" inputmode="url" data-validate="url" data-media-picker="branding" placeholder="Blank = the standard DGSS Realty logo">
        <p class="admin-field-hint" id="s-logo_url-hint">Upload the logo in Media Library → Branding, then choose it here. PNG/WebP with a transparent background works best (shown about 44px tall).</p>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>

</body>
</html>
