<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — DGSS Realty</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <span class="brand-wordmark admin-wordmark"><span class="wm-dgss">DGSS</span><span class="wm-realty">REALTY</span></span>
    </div>
    <p class="admin-login-sub">Admin login</p>

    <div class="admin-login-error" id="adminLoginError" role="alert"></div>
    <div class="admin-login-notice" id="adminLoginNotice" role="status"></div>

    <form id="adminLoginForm" novalidate>
      <div class="admin-field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" name="email" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="adminPassword">Password</label>
        <div class="admin-password-wrap">
          <input type="password" id="adminPassword" name="password" autocomplete="current-password" required>
          <button type="button" class="admin-password-toggle" id="adminPasswordToggle" aria-label="Show password" aria-controls="adminPassword">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;padding:12px;margin-top:6px;">Log In</button>
    </form>
    <p class="admin-login-links"><a href="#" id="forgotPasswordLink">Forgot password?</a></p>

    <form id="forgotPasswordForm" novalidate hidden>
      <p class="admin-login-help">Enter your staff email address. We'll send you a link to choose a new password.</p>
      <div class="admin-field">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" name="email" autocomplete="username" required>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;padding:12px;">Send reset link</button>
      <p class="admin-login-links"><a href="#" id="backToLoginLink">Back to login</a></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>

</body>
</html>
