<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Properties — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="Properties" data-nav="properties-all">
</head>
<body>

<div id="adminShellSlot"></div>

<template id="propertiesTemplate">
  <div class="admin-card" style="padding:18px 20px;margin-bottom:18px;">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
      <label for="propSearch" class="sr-only">Search properties</label>
      <input type="search" id="propSearch" class="admin-filter-input" placeholder="Search by title or location…">
      <label for="propFilterCategory" class="sr-only">Category</label>
      <select id="propFilterCategory" class="admin-filter-select">
        <option value="">All Categories</option>
      </select>
      <label for="propFilterListingType" class="sr-only">Listing type</label>
      <select id="propFilterListingType" class="admin-filter-select">
        <option value="">All Listing Types</option>
        <option>For Sale</option><option>For Rent</option><option>For Lease</option>
      </select>
      <label for="propFilterStatus" class="sr-only">Market status</label>
      <select id="propFilterStatus" class="admin-filter-select">
        <option value="">All Market Statuses</option>
        <option>Available</option><option>Under Offer</option><option>Sold</option><option>Rented</option><option>Leased</option><option>Inactive</option>
      </select>
      <label for="propFilterPublished" class="sr-only">Workflow stage</label>
      <select id="propFilterPublished" class="admin-filter-select">
        <option value="">All Stages</option>
        <option value="draft">Draft</option>
        <option value="under_review">Under Review</option>
        <option value="approved">Approved (not yet live)</option>
        <option value="published">Published</option>
      </select>
      <label for="propSort" class="sr-only">Sort by</label>
      <select id="propSort" class="admin-filter-select">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="updated">Recently Updated</option>
      </select>
      <a href="property-edit.html" class="admin-btn admin-btn-primary">+ Add Property</a>
    </div>
  </div>

  <div class="admin-card admin-table-card">
    <table class="admin-table admin-table-responsive">
      <caption class="sr-only">Properties</caption>
      <thead>
        <tr>
          <th><span class="sr-only">Photo</span></th>
          <th>Title</th>
          <th>Category</th>
          <th>Listing</th>
          <th>Status</th>
          <th>Price</th>
          <th>Featured</th>
          <th>Stage</th>
          <th><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="propertiesTableBody">
        <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--slate);">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
    <span id="propResultCount" style="font-size:12.5px;color:var(--slate);"></span>
    <div id="propPagination" style="display:flex;gap:6px;"></div>
  </div>
</template>

<div class="admin-modal-overlay" id="deleteConfirmOverlay" aria-hidden="true">
  <div class="admin-modal" role="alertdialog" aria-modal="true" aria-labelledby="deleteConfirmTitle">
    <h3 id="deleteConfirmTitle">Delete this property?</h3>
    <p>This can't be undone. All of its images will be removed too. Consider Archiving instead if you might need it later.</p>
    <div class="admin-modal-actions">
      <button type="button" class="admin-btn admin-btn-outline" id="deleteCancelBtn">Cancel</button>
      <button type="button" class="admin-btn admin-btn-danger" id="deleteConfirmBtn" style="background:var(--red);color:#fff;">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-rules.js" defer></script>
<script src="js/admin-properties-list.js" defer></script>
</body>
</html>
