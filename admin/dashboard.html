<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="Dashboard" data-nav="dashboard">
</head>
<body>

<div id="adminShellSlot"></div>

<template id="dashboardTemplate">
  <div id="quickActions" class="admin-actions-row" style="margin-bottom:18px;"></div>

  <h2 class="admin-section-title" style="margin-top:0;">Properties</h2>
  <div class="admin-stat-grid" id="propertyStats"></div>

  <section id="leadStatsSection" hidden>
    <h2 class="admin-section-title">Enquiries</h2>
    <div class="admin-stat-grid" id="leadStats"></div>
    <div class="admin-two-col admin-two-col-even" style="margin-bottom:20px;">
      <div class="admin-card admin-pad">
        <h3 class="admin-card-title">Open enquiries by source</h3>
        <ul class="admin-bar-list" id="leadSources"></ul>
      </div>
      <div class="admin-card admin-pad">
        <div class="admin-card-head"><h3 class="admin-card-title">Follow-ups due (next 7 days)</h3><a href="leads.html?followup=due" class="admin-btn admin-btn-ghost admin-btn-sm">View all</a></div>
        <div id="pendingFollowUps"><p class="admin-subtext">Loading…</p></div>
      </div>
    </div>
  </section>

  <div class="admin-two-col">
    <div class="admin-card admin-pad">
      <div class="admin-card-head"><h3 class="admin-card-title">Recently updated properties</h3><a href="properties.html" class="admin-btn admin-btn-ghost admin-btn-sm">View all</a></div>
      <div id="recentProperties"><p class="admin-subtext">Loading…</p></div>
    </div>
    <div class="admin-card admin-pad" id="recentLeadsCard" hidden>
      <div class="admin-card-head"><h3 class="admin-card-title">Recent enquiries</h3><a href="leads.html" class="admin-btn admin-btn-ghost admin-btn-sm">View all</a></div>
      <div id="recentLeads"><p class="admin-subtext">Loading…</p></div>
    </div>
  </div>

  <div class="admin-card admin-pad" id="recentActivityCard" hidden style="margin-top:20px;">
    <div class="admin-card-head"><h3 class="admin-card-title">Recent activity</h3><a href="audit.html" class="admin-btn admin-btn-ghost admin-btn-sm" id="auditLink" hidden>Full audit log</a></div>
    <ol class="admin-timeline" id="recentActivity"></ol>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-dashboard.js" defer></script>
</body>
</html>
