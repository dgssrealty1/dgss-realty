<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SEO — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="SEO" data-nav="seo">
</head>
<body data-settings-fields="home_seo_title,home_seo_description,default_seo_title,default_seo_description,default_og_image_url">
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card admin-form-card">
    <form id="settingsForm" novalidate>
      <h2 class="admin-section-title">Homepage</h2>
      <div class="admin-field">
        <label for="s-home_seo_title">Homepage Title</label>
        <input type="text" id="s-home_seo_title" aria-describedby="s-home_seo_title-hint" maxlength="120">
        <p class="admin-field-hint" id="s-home_seo_title-hint">Shown in Google and browser tabs. ~50–60 characters. Blank = the site-wide default title below.</p>
      </div>
      <div class="admin-field">
        <label for="s-home_seo_description">Homepage Meta Description</label>
        <textarea id="s-home_seo_description" aria-describedby="s-home_seo_description-hint" maxlength="300"></textarea>
        <p class="admin-field-hint" id="s-home_seo_description-hint">~150–160 characters. Blank = the site-wide default description below.</p>
      </div>
      <h2 class="admin-section-title">Site-wide defaults</h2>
      <div class="admin-field">
        <label for="s-default_seo_title">Default SEO Title</label>
        <input type="text" id="s-default_seo_title" aria-describedby="s-default_seo_title-hint" maxlength="120">
        <p class="admin-field-hint" id="s-default_seo_title-hint">Used where a page has nothing more specific (the homepage when its own title is blank).</p>
      </div>
      <div class="admin-field">
        <label for="s-default_seo_description">Default Meta Description</label>
        <textarea id="s-default_seo_description" aria-describedby="s-default_seo_description-hint" maxlength="300"></textarea>
        <p class="admin-field-hint" id="s-default_seo_description-hint">Used where a page has nothing more specific.</p>
      </div>
      <div class="admin-field">
        <label for="s-default_og_image_url">Default Share Image</label>
        <input type="text" id="s-default_og_image_url" aria-describedby="s-default_og_image_url-hint" inputmode="url" data-validate="url" data-media-picker="homepage,general,branding">
        <p class="admin-field-hint" id="s-default_og_image_url-hint">Image shown when the homepage or a property without photos is shared on WhatsApp / Facebook (1200×630 recommended). Blank = the hero photo.</p>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
    </form>
  </div>

  <div class="admin-card admin-form-card">
    <h2 class="admin-section-title" style="margin-top:0;">How property pages get their SEO</h2>
    <ol class="admin-steps">
      <li>The property’s own <strong>SEO title / description / share image / canonical URL</strong> (Properties → Edit → SEO tab), if filled in.</li>
      <li>Otherwise an automatic title and description built from the property’s real details (type, area, size, price).</li>
      <li>The site-wide defaults above only when neither is available.</li>
    </ol>
    <p class="admin-card-intro" style="margin-top:10px;">Meta keywords are not used — search engines ignore them.</p>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>

</body>
</html>
