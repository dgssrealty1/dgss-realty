<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Testimonials — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="Testimonials" data-nav="testimonials">
</head>
<body>

<div id="adminShellSlot"></div>

<template id="testimonialsTemplate">
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
    <button type="button" class="admin-btn admin-btn-primary" id="addTestimonialBtn">+ Add Testimonial</button>
  </div>

  <div class="admin-card" style="padding:16px 20px;margin-bottom:16px;background:#FFF3DC;border-color:#F5D28A;">
    <strong style="font-size:13px;">Nothing here is shown publicly until you publish it.</strong>
    <p style="font-size:12.5px;color:var(--slate);margin-top:4px;">New testimonials are saved as unpublished drafts by default — the public Testimonials section only ever shows reviews you've explicitly published, never automatically.</p>
  </div>

  <div id="testimonialsList"></div>
</template>

<div class="admin-modal-overlay" id="testimonialFormOverlay" aria-hidden="true">
  <div class="admin-modal" style="max-width:480px;" role="dialog" aria-modal="true" aria-labelledby="testimonialModalTitle">
    <h3 id="testimonialModalTitle">Add Testimonial</h3>
    <form id="testimonialForm" novalidate style="margin-top:14px;">
      <input type="hidden" id="t-id">
      <div class="admin-field"><label for="t-client_name">Client Name <span class="req">*</span></label><input type="text" id="t-client_name" maxlength="80" required></div>
      <div class="admin-form-row">
        <div class="admin-field"><label for="t-client_role">Role</label><input type="text" id="t-client_role" maxlength="80" placeholder="e.g. Property Buyer"></div>
        <div class="admin-field"><label for="t-location">Location</label><input type="text" id="t-location" maxlength="80" placeholder="e.g. Adyar"></div>
      </div>
      <div class="admin-field"><label for="t-review">Review <span class="req">*</span></label><textarea id="t-review" maxlength="1200" required style="min-height:110px;"></textarea></div>
      <div class="admin-form-row">
        <div class="admin-field"><label for="t-rating">Rating (1–5)</label><input type="number" id="t-rating" min="1" max="5" step="1" inputmode="numeric">
          <p class="admin-field-hint">Shown as stars. Blank = no stars.</p></div>
        <div class="admin-field"><label for="t-photo_url">Photo URL</label><input type="url" id="t-photo_url" placeholder="https://… or /media/site-media/…">
          <p class="admin-field-hint">Optional. Upload in Media Library → General, then Copy URL. Blank = initials.</p></div>
      </div>
      <label class="admin-checkbox" style="margin-bottom:18px;"><input type="checkbox" id="t-is_published"> Published (visible on the public site)</label>
      <div class="admin-modal-actions">
        <button type="button" class="admin-btn admin-btn-outline" id="testimonialCancelBtn">Cancel</button>
        <button type="submit" class="admin-btn admin-btn-primary">Save Testimonial</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-testimonials.js" defer></script>
</body>
</html>
