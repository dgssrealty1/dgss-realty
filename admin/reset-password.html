<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Choose a New Password — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <span class="brand-wordmark admin-wordmark"><span class="wm-dgss">DGSS</span><span class="wm-realty">REALTY</span></span>
    </div>
    <h1 class="admin-login-sub" id="resetIntro">Choose a new password</h1>

    <div class="admin-login-error" id="adminLoginError" role="alert"></div>
    <p class="admin-login-help" id="resetWaiting">Checking your reset link…</p>

    <form id="resetPasswordForm" novalidate hidden>
      <div class="admin-field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="10" required aria-describedby="newPasswordHint">
        <p class="admin-field-hint" id="newPasswordHint">At least 10 characters.</p>
      </div>
      <div class="admin-field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" required>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;padding:12px;">Save new password</button>
    </form>
    <p class="admin-login-links"><a href="login.html">Back to login</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
</body>
</html>
