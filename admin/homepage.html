<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Homepage — DGSS Realty Admin</title>
<link rel="stylesheet" href="css/admin.css">
<meta name="dgss-admin-page" content="Homepage" data-nav="homepage">
</head>
<body data-settings-fields="hero_heading,hero_subheading,hero_cta_text,founder_name,founder_designation,founder_location,founder_experience,founder_credential_line,founder_photo_url,founder_bio_intro,founder_bio_top,founder_bio_bottom,founder_quote">
<div id="adminShellSlot"></div>

<template id="settingsFormTemplate">
  <div class="admin-card admin-form-card">
    <p class="admin-card-intro">These control the homepage text. Any field left blank keeps the website's standard wording for that item. Changes are live within a few seconds.</p>
    <form id="settingsForm" novalidate>
      <h2 class="admin-section-title">Hero Section</h2>
      <div class="admin-field">
        <label for="s-hero_heading">Hero Heading</label>
        <textarea id="s-hero_heading" aria-describedby="s-hero_heading-hint" maxlength="160" rows="2"></textarea>
        <p class="admin-field-hint" id="s-hero_heading-hint">Put a second line on a new line to show it in the accent colour (e.g. “Find your next property.” ↵ “With trusted guidance.”).</p>
      </div>
      <div class="admin-field">
        <label for="s-hero_subheading">Hero Subheading</label>
        <textarea id="s-hero_subheading" maxlength="400"></textarea>
      </div>
      <div class="admin-field">
        <label for="s-hero_cta_text">Main Button Text</label>
        <input type="text" id="s-hero_cta_text" aria-describedby="s-hero_cta_text-hint" maxlength="40">
        <p class="admin-field-hint" id="s-hero_cta_text-hint">The button that scrolls to the listings, e.g. “Explore Properties”.</p>
      </div>
      <h2 class="admin-section-title">Founder Section</h2>
      <div class="admin-field">
        <label for="s-founder_name">Founder Name</label>
        <input type="text" id="s-founder_name" maxlength="80" placeholder="e.g. D. Gopi">
      </div>
      <div class="admin-field">
        <label for="s-founder_designation">Designation</label>
        <input type="text" id="s-founder_designation" aria-describedby="s-founder_designation-hint" maxlength="120">
        <p class="admin-field-hint" id="s-founder_designation-hint">Shown on its own and with the company name (e.g. “Real Estate Advisor – DGSS Realty”).</p>
      </div>
      <div class="admin-field">
        <label for="s-founder_location">Location</label>
        <input type="text" id="s-founder_location" maxlength="120" placeholder="e.g. K.K. Nagar, Chennai">
      </div>
      <div class="admin-field">
        <label for="s-founder_experience">Experience Badge</label>
        <input type="text" id="s-founder_experience" maxlength="80" placeholder="e.g. 20+ Years Experience">
      </div>
      <div class="admin-field">
        <label for="s-founder_credential_line">Credential Line (About section)</label>
        <input type="text" id="s-founder_credential_line" maxlength="200">
      </div>
      <div class="admin-field">
        <label for="s-founder_photo_url">Founder Photo</label>
        <input type="text" id="s-founder_photo_url" aria-describedby="s-founder_photo_url-hint" inputmode="url" data-validate="url" data-media-picker="founder">
        <p class="admin-field-hint" id="s-founder_photo_url-hint">Square photo, at least 600×600. Upload it in Media Library → Founder. Blank keeps the current photo.</p>
      </div>
      <div class="admin-field">
        <label for="s-founder_bio_intro">Bio — intro line</label>
        <textarea id="s-founder_bio_intro" maxlength="400"></textarea>
      </div>
      <div class="admin-field">
        <label for="s-founder_bio_top">Bio — first part</label>
        <textarea id="s-founder_bio_top" aria-describedby="s-founder_bio_top-hint" maxlength="3000" style="min-height:140px;"></textarea>
        <p class="admin-field-hint" id="s-founder_bio_top-hint">Separate paragraphs with a blank line.</p>
      </div>
      <div class="admin-field">
        <label for="s-founder_bio_bottom">Bio — second part</label>
        <textarea id="s-founder_bio_bottom" aria-describedby="s-founder_bio_bottom-hint" maxlength="3000" style="min-height:140px;"></textarea>
        <p class="admin-field-hint" id="s-founder_bio_bottom-hint">Appears after the highlights row. Separate paragraphs with a blank line.</p>
      </div>
      <div class="admin-field">
        <label for="s-founder_quote">Founder Quote</label>
        <textarea id="s-founder_quote" maxlength="400"></textarea>
      </div>
      <button type="submit" class="admin-btn admin-btn-primary">Save Changes</button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="../js/supabase-client.js" defer></script>
<script src="js/admin-auth.js" defer></script>
<script src="js/admin-shell.js" defer></script>
<script src="js/admin-settings-form.js" defer></script>

</body>
</html>
